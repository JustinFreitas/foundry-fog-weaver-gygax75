name: Release Creation

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x

      - name: Run JS Syntax Check
        run: npm run check

      - name: Run Unit Tests
        run: npm test

      # Substitute the Manifest and Download URLs in module.json for this release
      - name: Substitute Manifest and Download Links For Versioned Ones
        id: sub_manifest_version
        env:
          VERSION: ${{ github.event.release.tag_name }}
          URL: https://github.com/${{ github.repository }}
          MANIFEST: https://github.com/${{ github.repository}}/releases/latest/download/module.json
          DOWNLOAD: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip
        run: |
          node -e '
            const fs = require("fs");
            const f = "module.json";
            const m = JSON.parse(fs.readFileSync(f, "utf8"));
            let v = process.env.VERSION;
            if (v.startsWith("v")) v = v.substring(1);
            m.version = v;
            m.url = process.env.URL;
            m.manifest = process.env.MANIFEST;
            m.download = process.env.DOWNLOAD;
            fs.writeFileSync(f, JSON.stringify(m, null, 2) + "\n");
          '

      # Create a zip file containing all files required by the module
      - name: Create module.zip bundle
        run: zip -r ./module.zip module.json README.md scripts/ styles/ lang/

      # Update the published release with module.json and module.zip
      - name: Update Release with Files
        id: create_version_release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.event.release.name }}
          draft: false
          prerelease: false
          make_latest: ${{ !github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./module.json
            ./module.zip
          tag_name: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
